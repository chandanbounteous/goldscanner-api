version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_DB: goldscanner_db
      POSTGRES_USER: goldscanner_user
      POSTGRES_PASSWORD: goldscanner_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - goldscanner_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldscanner_user -d goldscanner_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - goldscanner_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: goldscanner-api:dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      LOG_LEVEL: ${LOG_LEVEL}
      GOLD_RATE_API_URL: ${GOLD_RATE_API_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - goldscanner_network
    command: >
      sh -c "
        echo '=== GoldScanner API Development Testing ===' &&
        echo 'Running database migrations...' &&
        npx prisma migrate deploy &&
        echo 'Running database seeding...' &&
        npm run db:seed &&
        echo 'Starting application...' &&
        exec node dist/index.js
      "

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  goldscanner_network:
    driver: bridge