version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_DB: ${POSTGRES_DB:-goldscanner_db}
      POSTGRES_USER: ${POSTGRES_USER:-goldscanner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - goldscanner_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldscanner_user} -d ${POSTGRES_DB:-goldscanner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - goldscanner_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    image: ${DOCKER_USERNAME}/goldscanner-api:${VERSION:-latest}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-goldscanner_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-goldscanner_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - goldscanner_network
    restart: unless-stopped
    command: >
      sh -c "
        echo '=== GoldScanner API Production Startup ===' &&
        npx prisma migrate deploy &&
        npm run db:seed &&
        exec node dist/index.js
      "

volumes:
  postgres_data:
  redis_data:

networks:
  goldscanner_network:
    driver: bridge