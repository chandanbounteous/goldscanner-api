version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_DB: goldscanner_db
      POSTGRES_USER: goldscanner_user
      POSTGRES_PASSWORD: goldscanner_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - goldscanner_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    networks:
      - goldscanner_network

volumes:
  postgres_data_local:
  redis_data_local:

networks:
  goldscanner_network:
    driver: bridge